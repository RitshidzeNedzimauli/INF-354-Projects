<div class="event-listing-container">
  
  <h2 class="page-title">CampusBuzz - Event Listing</h2>

  <div class="events-container">
    
    <div *ngFor="let event of events" class="event-card">
      
      <div class="event-info">
        <h3 class="event-title">{{ event.title }}</h3>
        
        <p class="event-detail">
          Location: <span class="highlight">{{ event.location }}</span>
        </p>
        
        <p class="event-detail">
          Price: 
          <span class="price">
            {{ event.ticketPrice === 0 ? 'Free' : '$' + event.ticketPrice }}
          </span>
        </p>
      </div>

      <div class="event-actions">
        <button [routerLink]="['/edit', event.id]" class="btn btn-edit">Edit</button>
        <button (click)="deleteEvent(event.id)" class="btn btn-delete">Delete</button>
      </div>
    </div>
  </div>

  <div *ngIf="events.length === 0" class="empty-state">
    No events available at the moment.
  </div>

</div>
