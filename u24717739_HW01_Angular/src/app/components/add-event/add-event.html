<div class="form-container">
  <div class="form-card">
    <h2 class="form-title">Add New Event</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <div class="form-group">
        <label>Event Title:</label>
        <input type="text" formControlName="title" placeholder="Enter event title">
      </div>

      <div class="form-group">
        <label>Location:</label>
        <input type="text" formControlName="location" placeholder="Enter location">
      </div>

      <div class="form-group">
        <label>Ticket Price:</label>
        <input type="number" formControlName="ticketPrice" placeholder="0 for free">
      </div>

      <div class="button-group">
        <button type="submit" 
                class="btn btn-submit"
                [disabled]="form.invalid">
          Submit
        </button>
        <button type="button" 
                class="btn btn-cancel"
                (click)="cancel()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
